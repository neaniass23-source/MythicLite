# ===== DUNGEON 1 =====
# Nombres, mensajes y hologramas en letras pequenas con colores pastel (sin q ni ene).
# Para dar skin con textura de cabeza: /mm model <mob> texture <base64>  (o rellena model: abajo y pon enabled: true)
# Recompensas: /mm rewards <mob>  (menu dentro del juego)

ahogado_ruinas:
  type: DROWNED
  name: "<#a8e6cf>⚔ ᴀʜᴏɢᴀᴅᴏ ᴅᴇ ʀᴜɪɴᴀꜱ <#d6e6ff>ɪ"
  health: 40
  damage: 4
  speed: 0.26
  armor: 2
  size: 1.15
  exp: 10
  vanilla-drops: false
  equipment:
    helmet: CASCO_AHOGADO
    chestplate: PECHERA_AHOGADO
  drops:
    - { item: LANZA_LEVIATAN, amount: 1, chance: 5 }
  money: { min: 1, max: 1, chance: 20 }
  points: { min: 1, max: 1, chance: 20 }
  skills:
    - { trigger: ON_DEATH, type: PARTICLE, particle: soul, count: 25, spread: 0.4 }
  hologram:
    enabled: true
    lines:
      - "%name%"
      - "%bar% <#ffffff>%health%<#aaaaaa>/<#ffffff>%maxhealth%"
    offset-y: 0.45
    scale: 1.0
    background: none
    billboard: CENTER
    shadow: true
  model:
    enabled: false
    head-texture: ""        # base64 de la textura (minecraft-heads.com)
    scale: 1.2
    offset-y: 0.0

